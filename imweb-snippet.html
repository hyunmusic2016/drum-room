<!-- 아임웹 코드 칸에 붙여 넣는 코드(페이지 안에 예약 화면 넣기)
     - 예약 화면이 자기 길이를 알려 주면 칸 높이를 자동으로 맞춥니다(아래 여백 없음).
     - 스크롤할 때마다 칸의 화면 위치를 예약 화면에 알려 줘서, 예약 창이 화면 가운데에 고정된 것처럼 보이게 합니다.
     - 스크립트가 막히는 환경에서는 처음 높이(1500px)로 고정되어 보입니다. -->
<iframe id="drumRoomFrame" src="https://hyunmusic2016.github.io/drum-room/" title="드럼 연습실 예약"
  style="display:block;width:100%;height:1500px;border:0;overflow:hidden" scrolling="no"></iframe>
<script>
(function(){
  var f=document.getElementById("drumRoomFrame"),ORIGIN="https://hyunmusic2016.github.io",busy=false;
  function sendView(){
    busy=false;
    if(!f.contentWindow)return;
    f.contentWindow.postMessage({type:"drum-room-view",top:f.getBoundingClientRect().top,vh:window.innerHeight},ORIGIN);
  }
  function onMove(){if(!busy){busy=true;requestAnimationFrame(sendView)}}
  window.addEventListener("scroll",onMove,{passive:true});
  window.addEventListener("resize",onMove);
  window.addEventListener("message",function(e){
    if(e.origin!==ORIGIN||!e.data)return; // 예약 화면이 보낸 것만 받음
    if(e.data.type==="drum-room-height"&&e.data.height>0){f.style.height=e.data.height+"px";onMove()}
    if(e.data.type==="drum-room-top"){var r=f.getBoundingClientRect();if(r.top<0)window.scrollBy(0,r.top-8)}
    if(e.data.type==="drum-room-ask")sendView();
    if(e.data.type==="drum-room-need"){ // 예약 창이 다 보이도록 칸이 화면에 충분히 들어오게 조금 스크롤
      var r=f.getBoundingClientRect(),vh=window.innerHeight,need=Math.min(e.data.height,vh),vis=Math.min(vh,r.bottom)-Math.max(0,r.top);
      if(vis<need){if(r.top>0)window.scrollBy(0,Math.min(r.top,need-vis));else if(r.bottom<vh)window.scrollBy(0,-Math.min(vh-r.bottom,need-vis))}
    }
  });
})();
</script>
